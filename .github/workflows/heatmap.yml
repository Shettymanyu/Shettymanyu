name: refresh-heatmap

on:
  schedule:
    - cron: "0 0 * * *" # daily 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/heatmap.py, .github/workflows/heatmap.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/heatmap.py --test
      - run: python scripts/heatmap.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh heatmap [skip ci]"
          git push
